<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZGI</title>

    <style>
      :root {
        --background: #f8fafc;
        --card: #ffffff;
        --primary: #1f235a;
        --text: #1f235a;
        --body: #475569;
        --muted: #94a3b8;
        --button-text: #ffffff;
        --shadow: rgba(15, 23, 42, 0.08);
        --success: #16a34a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--background);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
          Roboto, Helvetica, Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      main {
        width: 100%;
        max-width: 420px;
        border-radius: 28px;
        background: var(--card);
        padding: 32px;
        text-align: center;
        box-shadow: 0 18px 45px var(--shadow);
      }

      .icon {
        width: 64px;
        height: 64px;
        border-radius: 999px;
        background: rgba(22, 163, 74, 0.12);
        color: var(--success);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 30px;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: 26px;
        line-height: 1.2;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text);
      }

      p {
        margin: 14px 0 0;
        color: var(--body);
        font-size: 16px;
        line-height: 1.6;
      }

      .button {
        display: inline-flex;
        margin-top: 24px;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: var(--primary);
        color: var(--button-text);
        padding: 14px 22px;
        text-decoration: none;
        font-weight: 700;
        font-size: 15px;
        -webkit-tap-highlight-color: transparent;
      }

      .button:active {
        transform: scale(0.99);
      }

      .hint {
        margin-top: 14px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }
    </style>
  </head>

  <body>
    <main>
      <div class="icon">✓</div>

      <h1 id="title">Configuración enviada</h1>

      <p id="description">
        Tu información fue enviada correctamente. Ya puedes volver a ZGI.
      </p>

      <a id="openApp" class="button" href="#">Volver a ZGI</a>

      <p id="hint" class="hint">
        Si la app no se abre automáticamente, toca el botón.
      </p>
    </main>

    <script>
      const translations = {
        es: {
          title: "Configuración enviada",
          description:
            "Tu información fue enviada correctamente. Ya puedes volver a ZGI.",
          button: "Volver a ZGI",
          hint: "Si la app no se abre automáticamente, toca el botón.",
        },
        en: {
          title: "Setup submitted",
          description:
            "Your information was submitted successfully. You can now return to ZGI.",
          button: "Back to ZGI",
          hint: "If the app does not open automatically, tap the button.",
        },
        it: {
          title: "Configurazione inviata",
          description:
            "Le tue informazioni sono state inviate correttamente. Ora puoi tornare su ZGI.",
          button: "Torna a ZGI",
          hint: "Se l'app non si apre automaticamente, tocca il pulsante.",
        },
        pt: {
          title: "Configuração enviada",
          description:
            "Suas informações foram enviadas com sucesso. Agora você pode voltar ao ZGI.",
          button: "Voltar ao ZGI",
          hint: "Se o app não abrir automaticamente, toque no botão.",
        },
        fr: {
          title: "Configuration envoyée",
          description:
            "Vos informations ont été envoyées avec succès. Vous pouvez maintenant retourner sur ZGI.",
          button: "Retourner à ZGI",
          hint: "Si l’app ne s’ouvre pas automatiquement, touchez le bouton.",
        },
      };

      const lang = navigator.language.slice(0, 2).toLowerCase();
      const copy = translations[lang] || translations.en;

      document.documentElement.lang = translations[lang] ? lang : "en";

      document.getElementById("title").textContent = copy.title;
      document.getElementById("description").textContent = copy.description;
      document.getElementById("openApp").textContent = copy.button;
      document.getElementById("hint").textContent = copy.hint;

      const deepLink = "exp://192.168.1.207:8081/--/";

      const openAppButton = document.getElementById("openApp");
      openAppButton.href = deepLink;

      setTimeout(() => {
        window.location.href = deepLink;
      }, 700);
    </script>
  </body>
</html>
