<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZGI</title>

    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #1f235a;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: 100%;
        max-width: 420px;
        border-radius: 28px;
        background: white;
        padding: 32px;
        text-align: center;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
      }

      .icon {
        width: 64px;
        height: 64px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 30px;
        font-weight: 700;
      }

      .icon.success {
        background: rgba(22, 163, 74, 0.12);
        color: #16a34a;
      }

      h1 {
        margin: 0;
        font-size: 26px;
        line-height: 1.2;
      }

      p {
        margin: 14px 0 0;
        color: #475569;
        font-size: 16px;
        line-height: 1.6;
      }

      .button {
        display: inline-flex;
        margin-top: 24px;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: #1f235a;
        color: white;
        padding: 14px 20px;
        text-decoration: none;
        font-weight: 700;
        font-size: 15px;
      }

      .hint {
        margin-top: 14px;
        color: #94a3b8;
        font-size: 13px;
      }
    </style>
  </head>

  <body>
    <main class="card">
      <div class="icon success">✓</div>

      <h1 id="title">Pago confirmado</h1>

      <p id="description">
        Tu compra fue procesada correctamente. Ya puedes volver a ZGI y acceder
        al tour.
      </p>

      <a id="openApp" class="button" href="zgi://">Volver a ZGI</a>

      <p id="hint" class="hint">
        Si la app no se abre automáticamente, vuelve manualmente a ZGI.
      </p>
    </main>

    <script>
      const translations = {
        es: {
          title: "Pago confirmado",
          description:
            "Tu compra fue procesada correctamente. Ya puedes volver a ZGI y acceder al tour.",
          button: "Volver a ZGI",
          hint: "Si la app no se abre automáticamente, vuelve manualmente a ZGI.",
        },
        en: {
          title: "Payment confirmed",
          description:
            "Your purchase was processed successfully. You can now return to ZGI and access the tour.",
          button: "Back to ZGI",
          hint: "If the app does not open automatically, return to ZGI manually.",
        },
        it: {
          title: "Pagamento confermato",
          description:
            "Il tuo acquisto è stato elaborato correttamente. Ora puoi tornare su ZGI e accedere al tour.",
          button: "Torna a ZGI",
          hint: "Se l'app non si apre automaticamente, torna manualmente su ZGI.",
        },
        pt: {
          title: "Pagamento confirmado",
          description:
            "Sua compra foi processada com sucesso. Agora você pode voltar ao ZGI e acessar o tour.",
          button: "Voltar ao ZGI",
          hint: "Se o app não abrir automaticamente, volte manualmente ao ZGI.",
        },
        fr: {
          title: "Paiement confirmé",
          description:
            "Votre achat a été traité avec succès. Vous pouvez maintenant retourner sur ZGI et accéder au tour.",
          button: "Retourner à ZGI",
          hint: "Si l’app ne s’ouvre pas automatiquement, retournez manuellement sur ZGI.",
        },
      };

      const lang = navigator.language.slice(0, 2).toLowerCase();
      const copy = translations[lang] || translations.en;

      document.documentElement.lang = translations[lang] ? lang : "en";

      document.getElementById("title").textContent = copy.title;
      document.getElementById("description").textContent = copy.description;
      document.getElementById("openApp").textContent = copy.button;
      document.getElementById("hint").textContent = copy.hint;

      const openAppButton = document.getElementById("openApp");
      openAppButton.href = "zgi://";

      setTimeout(() => {
        window.location.href = "zgi://";
      }, 700);
    </script>
  </body>
</html>
