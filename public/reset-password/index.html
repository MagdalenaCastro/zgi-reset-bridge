<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>ZGI - Restablecer contraseña</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #f6f6f6;
        margin: 0;
        padding: 24px;
      }

      .card {
        max-width: 420px;
        background: white;
        padding: 32px;
        border-radius: 16px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      a {
        display: inline-block;
        margin-top: 16px;
        padding: 12px 18px;
        background: #111;
        color: white;
        text-decoration: none;
        border-radius: 8px;
      }

      .muted {
        color: #666;
        font-size: 14px;
        margin-top: 16px;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>Restablecer contraseña</h1>
      <p>Estamos abriendo ZGI para que puedas continuar.</p>

      <a id="openApp" href="#">Abrir ZGI</a>

      <p class="muted">
        Si la app no se abre automáticamente, toca el botón.
      </p>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);

      const userId = params.get("userId");
      const secret = params.get("secret");

      const deepLink = `zgi://reset-password?userId=${encodeURIComponent(
        userId || ""
      )}&secret=${encodeURIComponent(secret || "")}`;

      const openAppButton = document.getElementById("openApp");
      openAppButton.href = deepLink;

      setTimeout(() => {
        window.location.href = deepLink;
      }, 500);
    </script>
  </body>
</html>
