<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>ZGI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      :root {
        --background: #ffffff;
        --text: #11181c;
        --button: #1F235A;
        --button-text: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--background);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }

      main {
        width: 100%;
        max-width: 320px;
        text-align: center;
      }

      .logo {
        width: 82px;
        height: 82px;
        object-fit: contain;
        display: block;
        margin: 0 auto 38px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.2;
        font-weight: 300;
        letter-spacing: -0.02em;
        color: var(--text);
      }

      .button {
        display: block;
        width: 100%;
        margin-top: 36px;
        padding: 16px 18px;
        border-radius: 14px;
        background: var(--button);
        color: var(--button-text);
        text-decoration: none;
        font-size: 16px;
        line-height: 1;
        font-weight: 400;
        text-align: center;
        -webkit-tap-highlight-color: transparent;
      }

      .button:active {
        transform: scale(0.99);
      }
    </style>
  </head>

  <body>
    <main>
      <img class="logo" src="../assets/icon.png" alt="ZGI" />

      <h1 id="title">Restablecer contraseña</h1>

      <a id="openApp" class="button" href="#">Abrir ZGI</a>
    </main>

    <script>
      const translations = {
        es: {
          title: "Restablecer contraseña",
          button: "Abrir ZGI",
        },
        en: {
          title: "Reset password",
          button: "Open ZGI",
        },
        it: {
          title: "Reimposta password",
          button: "Apri ZGI",
        },
        pt: {
          title: "Redefinir senha",
          button: "Abrir ZGI",
        },
        fr: {
          title: "Réinitialiser le mot de passe",
          button: "Ouvrir ZGI",
        },
      };

      const lang = navigator.language.slice(0, 2).toLowerCase();
      const copy = translations[lang] || translations.en;

      document.documentElement.lang = translations[lang] ? lang : "en";

      document.getElementById("title").textContent = copy.title;
      document.getElementById("openApp").textContent = copy.button;

      const params = new URLSearchParams(window.location.search);

      const userId = params.get("userId");
      const secret = params.get("secret");

      const deepLink = `exp://192.168.1.207:8081/--/reset-password?userId=${encodeURIComponent(
        userId || ""
      )}&secret=${encodeURIComponent(secret || "")}`;

      const openAppButton = document.getElementById("openApp");
      openAppButton.href = deepLink;

      setTimeout(() => {
        window.location.href = deepLink;
      }, 700);
    </script>
  </body>
</html>
